
{% extends 'base.html' %}

{% block title %}
Cadastrar Cliente | FleetCard
{% endblock %}

{% block content %}

<!-- Cadastro de Cliente -->
<section class="container-fluid py-4 py-md-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-lg-9 col-xl-8">

                <div class="card shadow-sm border-0">

                    <!-- Cabeçalho -->
                    <div class="card-header bg-primary text-white text-center py-3">

                        <h2 class="h4 mb-1 fw-bold">
                            <i class="bi bi-person-plus-fill"></i>
                            Cadastrar Cliente
                        </h2>

                        <p class="mb-0 small">
                            Preencha os dados do cliente
                        </p>

                    </div>

                    <!-- Formulário -->
                    <div class="card-body p-3 p-md-4 p-lg-5">

                        <form method="POST">

                            {% csrf_token %}

                            <div class="row g-3">

                                <!-- Nome -->
                                <div class="col-12">

                                    <label for="nome" class="form-label fw-semibold">
                                        <i class="bi bi-person-fill"></i>
                                        Nome
                                    </label>

                                    <input
                                        type="text"
                                        name="nome"
                                        id="nome"
                                        class="form-control"
                                        placeholder="Digite o nome completo"
                                        required
                                    >

                                </div>

                                <!-- CPF/CNPJ -->
                                <div class="col-12 col-md-6">

                                    <label for="cpf_cnpj" class="form-label fw-semibold">
                                        <i class="bi bi-card-text"></i>
                                        CPF/CNPJ
                                    </label>

                                    <input
                                        type="text"
                                        name="cpf_cnpj"
                                        id="cpf_cnpj"
                                        class="form-control"
                                        placeholder="Digite o CPF ou CNPJ"
                                        maxlength="18"
                                        required
                                    >

                                </div>

                                <!-- Telefone -->
                                <div class="col-12 col-md-6">

                                    <label for="telefone" class="form-label fw-semibold">
                                        <i class="bi bi-telephone-fill"></i>
                                        Telefone
                                    </label>

                                    <input
                                        type="text"
                                        name="telefone"
                                        id="telefone"
                                        class="form-control"
                                        placeholder="Digite o telefone"
                                        maxlength="20"
                                        required
                                    >

                                </div>

                                <!-- E-mail -->
                                <div class="col-12">

                                    <label for="email" class="form-label fw-semibold">
                                        <i class="bi bi-envelope-fill"></i>
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        name="email"
                                        id="email"
                                        class="form-control"
                                        placeholder="Digite o e-mail"
                                    >

                                </div>

                                <!-- Endereço -->
                                <div class="col-12">

                                    <label for="endereco" class="form-label fw-semibold">
                                        <i class="bi bi-geo-alt-fill"></i>
                                        Endereço
                                    </label>

                                    <input
                                        type="text"
                                        name="endereco"
                                        id="endereco"
                                        class="form-control"
                                        placeholder="Digite o endereço"
                                    >

                                </div>

                            </div>

                            <!-- Botões -->
                            <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-4">

                                <a
                                    href="{% url 'lista_clientes' %}"
                                    class="btn btn-secondary px-4"
                                >
                                    <i class="bi bi-arrow-left"></i>
                                    Voltar
                                </a>

                                <button
                                    type="submit"
                                    class="btn btn-primary px-4"
                                >
                                    <i class="bi bi-check-circle-fill"></i>
                                    Cadastrar Cliente
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
